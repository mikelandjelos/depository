baseURL = 'https://depository.mihajlo-madic.workers.dev/'
languageCode = 'en-us'
title = 'Mihajlo Madić'
timeZone = 'Europe/Belgrade'

# Quarto source files (.qmd/.ipynb) live alongside their rendered index.md in
# content/posts/<slug>/ page bundles. Hugo should serve the rendered output
# and the figures Quarto generates, but not publish the raw source.
ignoreFiles = ['\.qmd$', '\.ipynb$']

[params]
  description = 'Personal site — research, notes, and writing.'
  authorURL = 'https://github.com/mikelandjelos'
  ogLocale = 'en_US'
  footer = '&copy; 2026'
  repoURL = 'https://github.com/mikelandjelos/depository'

[taxonomies]
  tag = 'tags'
  category = 'categories'

# Keep Hugo's native RSS 2.0 feeds enabled for the site, post index, and
# taxonomy pages. Term feeds make it possible to subscribe to one tag or
# category without receiving every post.
[outputs]
  home = ['HTML', 'RSS']
  section = ['HTML', 'RSS']
  taxonomy = ['HTML', 'RSS']
  term = ['HTML', 'RSS']

[caches]
  [caches.getresource]
    # Hugo's default is maxAge = -1 (cache forever) for resources.GetRemote,
    # which made the "Unresolved Promises" GitHub issue list (list.html) go
    # stale indefinitely on the local dev server after an issue was
    # retitled. 1h keeps it reasonably fresh without hammering the GitHub
    # API on every build.
    maxAge = '1h'

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true  # needed for sidenote HTML in markdown
    [markup.goldmark.extensions.passthrough]
      enable = true
      [markup.goldmark.extensions.passthrough.delimiters]
        block = [['$$', '$$']]
        inline = [['$', '$']]
  [markup.highlight]
    noClasses = false  # use CSS classes for syntax highlighting

[menus]
  [[menus.main]]
    name = 'Posts'
    url = '/posts/'
    weight = 10
  [[menus.main]]
    name = 'About'
    url = '/about/'
    weight = 20
  [[menus.main]]
    name = 'Curriculum Vitae'
    url = '/cv/'
    weight = 30
  [[menus.main]]
    name = 'Statistics'
    url = '/stats/'
    weight = 40
